<div class="m-plan" data-plan-root>
  <section class="m-plan-command" aria-label="Plan summary">
    <p class="m-plan-headline" data-plan-headline>—</p>
    <div class="m-coverage">
      <div class="m-coverage-bar" role="img" data-coverage-bar aria-label="Funding coverage">
        <span class="m-coverage-fill" data-coverage-fill></span>
      </div>
      <p class="m-coverage-caption">
        <span data-coverage-text></span>
      </p>
    </div>
    <dl class="m-plan-stats">
      <div><dt>Total planned</dt><dd data-plan-total>—</dd></div>
      <div><dt>Funded</dt><dd data-plan-funded>—</dd></div>
      <div><dt>Unfunded</dt><dd data-plan-unfunded>—</dd></div>
      <div><dt>Next due</dt><dd data-plan-next-due>—</dd></div>
    </dl>
    <p class="m-plan-shortfall" data-plan-shortfall hidden></p>
  </section>

  <section class="m-plan-allocation" aria-label="Where the money sits">
    <h2 class="m-section-label">Allocation</h2>
    <div class="m-allocation-bar" data-allocation-bar></div>
    <ul class="m-allocation-legend" data-allocation-legend></ul>
  </section>

  <section class="m-plan-timeline" aria-label="Upcoming funding">
    <h2 class="m-section-label">Next 30 days</h2>
    <p class="m-empty-note" data-timeline-empty hidden>No funding events projected yet.</p>
    <ul class="m-timeline" data-timeline></ul>
  </section>

  <section class="m-plan-commitments" aria-label="Commitments">
    <h2 class="m-section-label">Commitments</h2>
    <p class="m-empty-note" data-commitments-empty hidden>No commitments yet.</p>
    <ul class="m-commitment-list" data-commitment-list></ul>
  </section>

  <p class="m-inline-error" data-plan-error role="alert" hidden></p>
</div>

<template data-funding-editor-template>
  <form class="m-funding-editor" data-funding-editor>
    <h3 class="m-editor-title">Funding rule</h3>
    <label class="m-field">
      <span class="m-field-label">Mode</span>
      <select class="m-select" name="kind">
        <option value="fixed_per_paycheck">Fixed per paycheck</option>
        <option value="percent_of_paycheck">Percent of paycheck</option>
        <option value="calendar">Calendar cadence</option>
        <option value="even_by_due_date">Even by due date</option>
      </select>
    </label>
    <label class="m-field" data-editor-field="amount">
      <span class="m-field-label">Amount</span>
      <input class="m-input" name="amount" type="number" min="0" step="0.01" inputmode="decimal">
    </label>
    <label class="m-field" data-editor-field="percent" hidden>
      <span class="m-field-label">Percent of paycheck</span>
      <input class="m-input" name="percent" type="number" min="0" max="100" step="0.1" inputmode="decimal">
    </label>
    <p class="m-editor-preview" data-editor-preview></p>
    <div class="m-editor-actions">
      <button type="submit" class="m-button">Save as proposal</button>
      <button type="button" class="m-button m-button--quiet" data-editor-cancel>Cancel</button>
    </div>
    <p class="m-editor-note" data-editor-note hidden></p>
  </form>
</template>
