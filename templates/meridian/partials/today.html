<dl class="m-today" data-today-root>
  <div class="m-sts">
    <dt class="m-sts-label">Safe to spend</dt>
    <dd class="m-sts-figure-block">
      <span class="m-sts-figure" data-sts-figure aria-live="polite">—</span>
      <span class="m-sts-note" data-sts-note hidden></span>
    </dd>
    <dd class="m-sts-chip-row">
      <span class="m-chip" data-freshness data-state="unavailable"></span>
    </dd>
  </div>

  <div class="m-inputs">
    <dt class="m-section-label">What this includes</dt>
    <dd>
      <ul class="m-input-list" data-today-inputs></ul>
      <p class="m-today-reason" data-today-reason hidden></p>
    </dd>
  </div>

  <div class="m-upcoming">
    <dt class="m-section-label">Upcoming money moments</dt>
    <dd>
      <p class="m-empty-note" data-upcoming-empty>No scheduled money moments yet.</p>
      <ul class="m-input-list" data-upcoming-list></ul>
    </dd>
  </div>

  <p class="m-inline-error" data-today-error role="alert" hidden></p>
</dl>
